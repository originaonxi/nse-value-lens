<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retirement 2031 — ₹5 crore cockpit · NSE Value Lens</title>
<style>
  :root{
    --bg:#0b0e13;--panel:#12161d;--panel2:#171c25;--line:#232a35;
    --ink:#e7edf5;--mut:#8b97a7;--dim:#5c6675;
    --buy:#2fb87a;--sell:#e5565b;--watch:#d8a43a;--add:#36c58a;--hold:#4a90d9;--trim:#d8a43a;--exit:#e5565b;
    --accent:#6ea8fe;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .kicker{letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-size:11px}
  h1{font-size:26px;margin:4px 0 2px;font-weight:650}
  .sub{color:var(--mut);font-size:13px}
  .nav a{color:var(--mut);font-size:12px;margin-left:14px}
  .paper{display:inline-block;margin-top:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#caa24a;border:1px solid #3a3320;background:#1c1810;border-radius:4px;padding:2px 7px}

  .cockpit{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin:18px 0}
  @media(max-width:820px){.cockpit{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
  .big{font-size:30px;font-weight:680;letter-spacing:-.01em}
  .big small{font-size:14px;color:var(--mut);font-weight:500}
  .bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2fb87a,#6ea8fe)}
  .row2{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
  .gauge{font-size:30px;font-weight:680}
  .gauge small{font-size:13px;color:var(--mut);font-weight:500}
  .plan{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
  .plan div{font-size:12px;color:var(--mut)}
  .plan b{display:block;color:var(--ink);font-size:16px;font-weight:620}
  .proj{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
  .proj td{padding:3px 0;border-bottom:1px solid var(--line);color:var(--mut)}
  .proj td:last-child{text-align:right;color:var(--ink)}
  .hit{color:var(--add)!important}

  .alloc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px}
  @media(max-width:820px){.alloc{grid-template-columns:1fr}}
  .alloc .card{border-left:3px solid var(--line)}
  .alloc .core{border-left-color:var(--hold)}
  .alloc .sat{border-left-color:var(--add)}
  .pct{font-size:22px;font-weight:680}

  .strip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;color:var(--mut);font-size:12px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
  .sector{display:inline-flex;gap:6px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%}

  .fund h2{font-size:16px;margin:14px 0 4px}
  .fund .note{color:var(--mut);font-size:12px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .stock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;transition:border-color .15s}
  .stock:hover{border-color:#36465c}
  .shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .sym{font-weight:660;font-size:15px}
  .nm{color:var(--dim);font-size:11px;font-weight:400}
  .chg{font-variant-numeric:tabular-nums;font-size:13px}
  .up{color:var(--buy)}.down{color:var(--sell)}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:6px 0 2px;color:var(--mut);font-size:11.5px}
  .badge{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:2px 7px;font-weight:650}
  .b-ADD{background:#10301f;color:var(--add);border:1px solid #1d5a3a}
  .b-HOLD{background:#13243a;color:#79b2f0;border:1px solid #244a74}
  .b-TRIM{background:#2c2410;color:var(--trim);border:1px solid #574818}
  .b-EXIT{background:#2e1414;color:#f0888c;border:1px solid #612428}
  .sbar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:7px 0;border:1px solid var(--line)}
  .sbar>i{display:block;height:100%}
  canvas{display:block;width:100%;height:92px;margin:6px 0 4px;border-radius:7px;background:var(--panel2)}
  .levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 10px;font-size:11.5px;color:var(--mut);margin-top:4px}
  .levels b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .jev{color:var(--dim);font-size:11px;margin-top:5px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
  .filters button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
  .filters button.on{color:var(--ink);border-color:#36465c;background:#1b2330}
  .foot{color:var(--dim);font-size:11px;margin-top:30px;border-top:1px solid var(--line);padding-top:14px}
  .err{color:#f0888c;padding:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="kicker">NSE Value Lens · Nifty 100 → our own top 50</div>
      <h1>Retirement 2031 — the ₹5 crore cockpit</h1>
      <div class="sub" id="asof">Loading…</div>
      <span class="paper">Paper research · not advice</span>
    </div>
    <div class="nav">
      <a href="./index.html">Home</a>
      <a href="./setups.html">Daily setups</a>
      <a href="./hhhl.html">HH/HL</a>
      <a href="./market-brief.html">Brief</a>
    </div>
  </div>

  <div class="cockpit" id="cockpit"></div>
  <div class="alloc" id="alloc"></div>
  <div class="strip" id="strip"></div>

  <div class="fund">
    <h2>Our Top 50 — the best of the Nifty 100</h2>
    <div class="note" id="fundnote"></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<script src="./retirement.js"></script>
</body>
</html>
