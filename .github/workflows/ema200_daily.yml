name: EMA 200 desk refresh
run-name: EMA 200 desk ${{ github.event.workflow_run.name || github.event.schedule || 'manual' }}
on:
  workflow_run:
    # the daily stock prices (data/hhhl_prices) are refreshed by HHHL after each NSE close
    workflows: ['HHHL daily refresh']
    types: [completed]
    branches: [master]
  schedule:
    # fallbacks: 18:45 and 22:45 IST, Monday-Friday
    - cron: '15 13 * * 1-5'
    - cron: '15 17 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ema200-desk
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Test the desk mechanics
        run: python -m unittest tests.test_ema200_fib -v
      - name: Groups, double-fib zones, 200-session test and Jev review
        run: python ema200_fib.py
      - name: Verify output
        run: python -m unittest tests.test_ema200_fib
      - name: Commit data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ema200.json public/data/ema200.json docs/ema200
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: EMA 200 desk ${{ github.run_id }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.commit.outputs.changed == 'true'
        name: Push
        run: |
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && break || sleep 15
          done
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@v4
