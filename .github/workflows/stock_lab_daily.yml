name: Stock formula lab refresh
run-name: Stock formula lab ${{ github.event.schedule || 'manual' }}
on:
  schedule:
    # 16:20 IST and 20:50 IST, Monday-Friday (after NSE close and the bhavcopy)
    - cron: '50 10 * * 1-5'
    - cron: '20 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: stock-formula-lab
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Test the lab mechanics
        run: python -m unittest tests.test_stock_lab -v
      - name: Refresh 1-hour candles, check against the NSE bhavcopy, test every formula
        run: python stock_lab.py
      - name: Verify output
        run: |
          python -c "
          import json
          d = json.load(open('docs/stock_lab.json'))
          assert len(d['stocks']) >= 25, 'too few stocks'
          bad = [s['symbol'] for s in d['stocks'] if s['check'].get('days') and s['check']['days_within_0_1pct'] < s['check']['days'] - 1]
          print('stock lab', d['last_candle'], '| stocks', len(d['stocks']), '| pick', d['pick'], '| bhavcopy mismatches', bad)
          "
          python -m unittest tests.test_stock_lab
      - name: Commit data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stock_lab.json public/data/stock_lab.json docs/stocklab data/stock_1h data/nse_isin.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: stock formula lab ${{ github.run_id }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.commit.outputs.changed == 'true'
        name: Push
        run: |
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && break || sleep 15
          done
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@v4
