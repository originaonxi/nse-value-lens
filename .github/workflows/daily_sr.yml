name: Daily S&R Refresh

# Runs every weekday at 16:30 IST (11:00 UTC) — 1 hour after NSE closes at 15:30
# NSE closes 15:30 IST = 10:00 UTC; we wait 1 hour for yfinance data to settle
# Also triggerable manually from GitHub Actions tab

on:
  schedule:
    - cron: '0 11 * * 1-5'   # 11:00 UTC = 16:30 IST, weekdays only
  workflow_dispatch:           # manual trigger any time

permissions:
  contents: write              # needed to commit sr_levels.json back to repo

jobs:
  refresh-sr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet yfinance pandas

      - name: Run S&R screener
        run: python daily_sr.py

      - name: Copy to docs/ for GitHub Pages
        run: cp screen_output/sr_levels.json docs/sr_levels.json

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screen_output/sr_levels.json docs/sr_levels.json
          git diff --staged --quiet || git commit -m "data: daily S&R refresh $(date -u +%Y-%m-%d)"
          git push
