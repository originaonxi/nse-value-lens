name: Daily S&R Refresh

# Three staggered schedules guard against GitHub's unreliable cron scheduler.
# Primary fires at 14:00 UTC (19:30 IST); backups at 15:00 and 16:00 UTC.
# A lightweight `guard` job reads docs/sr_levels.json — if as_of is already
# today (IST), the expensive refresh-sr job is skipped entirely (idempotent).
# NSE closes 15:30 IST = 10:00 UTC; Bhavcopy available ~12:30 UTC (~18:00 IST).
# workflow_dispatch always runs regardless of the idempotency check.

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 14:00 UTC = 19:30 IST (primary)
    - cron: '0 15 * * 1-5'   # 15:00 UTC = 20:30 IST (fallback 1)
    - cron: '0 16 * * 1-5'   # 16:00 UTC = 21:30 IST (fallback 2)
  workflow_dispatch:           # manual trigger any time

permissions:
  contents: write              # needed to commit sr_levels.json back to repo

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if already refreshed today (IST)
        id: check
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          AS_OF=$(jq -r '.as_of // empty' docs/sr_levels.json 2>/dev/null || echo "")
          if [ "$AS_OF" = "$TODAY" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already refreshed for $TODAY — skipping this scheduled run."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will refresh: as_of=${AS_OF:-missing} today=$TODAY event=${{ github.event_name }}"
          fi

  refresh-sr:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet yfinance pandas

      - name: Run S&R screener
        run: python daily_sr.py

      - name: Run JEV judgment layer
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then echo "JEV skipped — TYPESAFE_API_KEY secret not set"; exit 0; fi
          python jev_rank.py
        continue-on-error: true  # JEV layer is additive; never break the core S&R refresh

      - name: Run monthly regime screener + JEV
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then echo "Monthly regime skipped — TYPESAFE_API_KEY secret not set"; exit 0; fi
          python monthly_regime.py
        continue-on-error: true  # monthly layer is additive; never break daily S&R

      - name: Run Momentum 30 Daily
        run: python momentum30_daily.py
        continue-on-error: true  # additive; never break daily refresh

      - name: Run SAM PICKS synthesis
        run: python sam_picks.py
        continue-on-error: true  # synthesis is additive; never break daily refresh

      - name: Run Swing Structure (Dow HH/HL/LH/LL)
        run: python swing_structure.py
        continue-on-error: true  # additive; never break core refresh

      - name: Run JEV calibration logger (Brier Score)
        run: python jev_calibration.py
        continue-on-error: true  # additive; never break core refresh

      - name: Copy to docs/ for GitHub Pages
        run: |
          cp screen_output/sr_levels.json docs/sr_levels.json
          AS_OF=$(jq -r .as_of screen_output/sr_levels.json)
          if [ -f screen_output/jev_rank.json ] && [ "$(jq -r .as_of screen_output/jev_rank.json)" = "$AS_OF" ]; then
            cp screen_output/jev_rank.json docs/jev_rank.json
            cp public/data/jev_rank.js docs/jev_rank.js
          else
            echo "JEV ranking stale or missing for $AS_OF — keeping previous docs/jev_rank.*"
          fi
          if [ -f screen_output/monthly_regimes.json ]; then
            cp screen_output/monthly_regimes.json docs/monthly_regimes.json
            cp public/data/monthly_regime.js docs/monthly_regime.js
          else
            echo "monthly_regimes.json missing — keeping previous docs/monthly_regime.*"
          fi
          if [ -f screen_output/momentum30_daily.json ] && [ "$(jq -r .as_of screen_output/momentum30_daily.json)" = "$AS_OF" ]; then
            cp screen_output/momentum30_daily.json docs/momentum30_daily.json
            echo "Momentum 30 Daily copied for $AS_OF"
          else
            echo "momentum30_daily.json missing or not fresh for $AS_OF — keeping previous docs/momentum30_daily.*"
          fi
          if [ -f screen_output/sam_picks.json ] && [ "$(jq -r .as_of screen_output/sam_picks.json)" = "$AS_OF" ]; then
            cp screen_output/sam_picks.json docs/sam_picks.json
            cp public/data/sam_picks.js docs/sam_picks.js
            if [ "$(jq -r .stale screen_output/sam_picks.json)" = "true" ]; then
              echo "SAM PICKS published but flagged STALE (JEV/regime layer behind) — UI banner will warn."
            fi
          else
            echo "sam_picks.json missing or not fresh for $AS_OF — keeping previous docs/sam_picks.*"
          fi
          if [ -f screen_output/swing_structure.json ] && [ "$(jq -r .as_of screen_output/swing_structure.json)" = "$AS_OF" ]; then
            cp screen_output/swing_structure.json docs/swing_structure.json
            cp public/data/swing_structure.js docs/swing_structure.js
            echo "Swing structure copied for $AS_OF"
          else
            echo "swing_structure.json missing or not fresh for $AS_OF — keeping previous docs/swing_structure.*"
          fi
          if [ -f screen_output/jev_calibration.json ]; then
            cp screen_output/jev_calibration.json docs/jev_calibration.json
            echo "JEV calibration copied"
          fi

      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screen_output/sr_levels.json screen_output/jev_rank.json public/data/jev_rank.js docs/sr_levels.json docs/jev_rank.json docs/jev_rank.js screen_output/monthly_regimes.json public/data/monthly_regime.js docs/monthly_regimes.json docs/monthly_regime.js screen_output/sam_picks.json public/data/sam_picks.js docs/sam_picks.json docs/sam_picks.js screen_output/momentum30_daily.json docs/momentum30_daily.json screen_output/swing_structure.json public/data/swing_structure.js docs/swing_structure.json docs/swing_structure.js screen_output/jev_calibration.json docs/jev_calibration.json screen_output/jev_outcomes.jsonl
          git diff --staged --quiet || git commit -m "data: daily S&R + JEV + Momentum30 refresh $(date -u +%Y-%m-%d)"
          git push
