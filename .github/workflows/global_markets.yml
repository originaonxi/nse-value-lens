name: Global commodities and forex refresh
on:
  schedule:
    # Prior global sessions have closed. Two retries; Saturday covers Friday.
    - cron: '35 4,7,10 * * 1-6'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: global-markets-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify global data validation and session boundaries
        run: python -m unittest discover -s tests -p 'test_global_markets.py' -v
      - name: Refresh only the separate commodity and forex files
        run: python global_markets.py
      - name: Commit only global price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/global_markets.json public/data/global_markets.json
          if [ -d data/global_prices ]; then git add data/global_prices; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: commodities and forex run ${GITHUB_RUN_ID}"
            for attempt in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-markets-prices
          path: docs/global_markets.json
          retention-days: 14
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
