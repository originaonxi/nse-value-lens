name: Research mechanics tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['research/**', 'indicator_research.py', 'hhhl_scanner.py', 'hhhl_refresh.py', '.github/workflows/hhhl_daily.yml', 'public/hhhl.js', 'public/hhhl-chart.js', 'src/hhhl-chart.test.js', 'tests/test_*.py', 'src/swing-data.js', '.github/workflows/research_tests.yml']
  pull_request:
    paths: ['research/**', 'indicator_research.py', 'hhhl_scanner.py', 'hhhl_refresh.py', '.github/workflows/hhhl_daily.yml', 'public/hhhl.js', 'public/hhhl-chart.js', 'src/hhhl-chart.test.js', 'tests/test_*.py', 'src/swing-data.js', '.github/workflows/research_tests.yml']
permissions:
  contents: read
jobs:
  mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
      - run: node --check public/indicator-lab.js
      - run: node --check public/hhhl.js
