name: EMA 105 F&O setup refresh
run-name: EMA 105 F&O after ${{ github.event.workflow_run.name || github.event.schedule || 'manual' }}
on:
  # Runs right after every HH/HL refresh (same daily rhythm as the HH/HL page), with backups.
  workflow_run:
    workflows: ['HHHL daily refresh']
    types: [completed]
    branches: [master]
  schedule:
    # 16:45 and 21:15 IST every weekday (backups if the HH/HL trigger does not fire).
    - cron: '15 11 * * 1-5'
    - cron: '45 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fno-ema105-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test the setup engine
        run: python -m unittest tests.test_fno_ema105 tests.test_nifty_combo -v
      - name: Run the setup on every F&O stock (2-hour candles)
        run: python fno_ema105.py
      - name: Check the output
        run: python -m unittest tests.test_fno_ema105 -v
      - name: Commit the F&O EMA 105 scan
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fno_ema105.json public/data/fno_ema105.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: EMA 105 F&O setup run ${GITHUB_RUN_ID}"
            for attempt in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
