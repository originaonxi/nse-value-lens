name: F&O stock coverage refresh
on:
  workflow_run:
    workflows: ['HHHL daily refresh']
    types: [completed]
    branches: [master]
  schedule:
    # Backup at 18:00 IST; normal runs follow each completed stock refresh.
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fno-stock-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify membership and stock data handling
        run: python -m unittest discover -s tests -p 'test_fno*.py' -v
      - name: Refresh the additional stock histories and F&O list
        run: python fno_refresh.py
      - name: Commit only F&O coverage data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hhhl_fno.json public/data/hhhl_fno.json
          if [ -d data/fno_prices ]; then git add data/fno_prices; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: F&O stock coverage run ${GITHUB_RUN_ID}"
            for attempt in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fno-stock-coverage
          path: docs/hhhl_fno.json
          retention-days: 14
  publish:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
