name: Daily setups refresh
run-name: Daily setups after ${{ github.event.workflow_run.name || github.event.schedule || 'manual' }}
on:
  # Rebuild the category list whenever any of its inputs is republished:
  # prices/structure (HHHL), extra F&O names, Jev rank (S&R), option IV / OI walls (options desk).
  workflow_run:
    workflows: ['HHHL daily refresh', 'F&O stock coverage refresh', 'Daily S&R Refresh', 'Options desk refresh']
    types: [completed]
    branches: [master]
  schedule:
    # After-close fallbacks at 16:15, 19:45 and 21:45 IST.
    # HHHL, F&O, S&R/Jev and options completion triggers also rebuild the list.
    - cron: '45 10 * * *'
    - cron: '15 14,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  # Serialize ranked-list writers with HHHL and S&R/Jev, avoiding output rebase conflicts.
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test indicators, categories and plan maths
        run: python -m unittest tests.test_daily_setups tests.test_setup_signals tests.test_setup_rank tests.test_daily_setups_automation -v
      - name: Recalculate prices, indicators, chart ranks and same-session Jev ranks
        run: |
          python scripts/verify_daily_setups.py --inputs-only --require-jev
          python daily_setups.py
          python scripts/verify_daily_setups.py --require-jev
      - name: Commit the daily list
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily_setups.json docs/daily_setups_series.json data/daily_setups_history
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: daily setups run ${GITHUB_RUN_ID}"
            for attempt in 1 2 3; do
              INPUTS_BEFORE=$(git hash-object docs/hhhl_scan.json docs/hhhl_fno.json docs/jev_rank.json docs/market_brief.json docs/options_desk.json)
              # Rebase conflicts fail visibly; never discard a runner's work with reset --hard.
              git pull --rebase origin master
              INPUTS_AFTER=$(git hash-object docs/hhhl_scan.json docs/hhhl_fno.json docs/jev_rank.json docs/market_brief.json docs/options_desk.json)
              if [ "$INPUTS_BEFORE" != "$INPUTS_AFTER" ]; then
                python scripts/verify_daily_setups.py --inputs-only --require-jev
                python daily_setups.py
                python scripts/verify_daily_setups.py --require-jev
                git add docs/daily_setups.json docs/daily_setups_series.json data/daily_setups_history
                git diff --cached --quiet || git commit -m "data: rebuild daily setups against updated inputs ${GITHUB_RUN_ID}"
              fi
              if git push origin HEAD:master; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.commit }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [refresh, publish]
    if: ${{ !cancelled() && needs.refresh.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify published daily date, prices, ranks and Jev provenance
        run: python scripts/verify_daily_setups.py --url https://originaonxi.github.io/nse-value-lens/ --timeout 180 --require-jev
